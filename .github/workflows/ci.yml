name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show repository structure
        run: |
          echo "Repository ready for RF PvPvE server development"
          find . -maxdepth 3 -type d | sort

      - name: Placeholder validation
        run: |
          echo "Add project-specific build or test steps here."
          echo "Current repository is prepared for server source development."
