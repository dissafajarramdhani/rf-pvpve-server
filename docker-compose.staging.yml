version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: rf-stage-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: rf_server_staging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - rf_stage_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rf-stage-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://0.0.0.0:8080
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      AppSettings__RequireHttps: "false"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=rf_server_staging;Username=postgres;Password=postgres
    depends_on:
      - db
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: rf-stage-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  rf_stage_postgres_data:
