version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: rf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rf_server
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - rf_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rf-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=rf_server;Username=postgres;Password=postgres
    depends_on:
      - db
    ports:
      - "8080:8080"

volumes:
  rf_postgres_data:
